services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      OPENCODE_API_KEY: ${OPENCODE_API_KEY}
      DISPATCH_MODEL: ${DISPATCH_MODEL:-deepseek-v4-flash-free}
      DISPATCH_WORKING_DIR: /app/workspace
    volumes:
      - workspace:/app/workspace
    restart: unless-stopped

volumes:
  workspace:
