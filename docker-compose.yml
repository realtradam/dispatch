services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["bun", "--watch", "packages/api/src/index.ts"]
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    env_file:
      - .env.dispatch
    environment:
      DISPATCH_WORKING_DIR: /app

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["bun", "run", "--cwd", "packages/frontend", "dev", "--", "--host"]
    ports:
      - "5173:5173"
    volumes:
      - .:/app
