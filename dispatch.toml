# ─── Permissions ─────────────────────────────────────────────────

[permissions]
read = "allow"

[permissions.edit]
"*" = "ask"
"src/**" = "allow"

[permissions.bash]
"npm test" = "allow"
"npm run *" = "allow"
"git status" = "allow"
"git diff" = "allow"
"git log *" = "allow"
"git branch *" = "allow"
"git add *" = "allow"
"git commit *" = "allow"
"git push *" = "allow"
"ls *" = "allow"
"*" = "ask"

[permissions.external_directory]
"~/*" = "ask"
"/tmp/*" = "allow"
